name: Android Release

# 发版链路：
#   本仓库（公开源码，脱敏）打 tag v1.0.x
#     → CI 从 secrets 还原签名 keystore + 注入真实 DEFAULT_CLOUD_API_URL
#     → assembleRelease + apksigner verify
#     → APK 作为构建产物留在本次 Actions run
#     → 同时发布到公开「发行仓库」XiSoul/Network-Panel-X-Releases 的 Releases
#       （App 内更新的 LATEST_RELEASE_API_URL 指向该仓库，必须发在那里才可见）
#
# 密钥权威来源：私有仓库 XiSoul/Network-Panel-X-Private（ci/secrets.env + app/signing/*.jks）
# 同步方式：在该私有仓库跑 scripts/sync-ci-secrets.sh

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref to build, for example 6eedede or v1.0.7"
        required: true
        type: string
      release_tag:
        description: "GitHub release tag, for example v1.0.7"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          CLOUD_API_URL: ${{ secrets.DEFAULT_CLOUD_API_URL }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p app/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/signing/networkpanelx-release.jks
          {
            echo "RELEASE_STORE_FILE=app/signing/networkpanelx-release.jks"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "DEFAULT_CLOUD_API_URL=$CLOUD_API_URL"
          } > local.properties

      - name: Verify release version
        id: version
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION_NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)
          RELEASE_TAG=${INPUT_RELEASE_TAG:-$GITHUB_REF_NAME}
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          test "$RELEASE_TAG" = "v$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signatures
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release artifact
        id: artifact
        shell: bash
        run: |
          FILE_NAME="Network-Panel-X-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE_NAME"
          echo "file=$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Network-Panel-X-${{ steps.version.outputs.name }}
          path: ${{ steps.artifact.outputs.file }}
          if-no-files-found: error

      - name: Extract changelog section
        id: notes
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          awk -v v="$VERSION_NAME" '
            $0 ~ "^## " v " " || $0 ~ "^## " v "$" { inside = 1; print; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf '## %s\n\n完整变更见 CHANGELOG.md。\n' "$VERSION_NAME" > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish to public releases repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          ASSET: ${{ steps.artifact.outputs.file }}
        run: |
          test -n "$GH_TOKEN" || { echo "缺少 secret RELEASES_REPO_TOKEN"; exit 1; }
          REPO="XiSoul/Network-Panel-X-Releases"
          if gh release view "$RELEASE_TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "release $RELEASE_TAG 已存在，改为上传/覆盖资产"
            gh release upload "$RELEASE_TAG" "$ASSET" --repo "$REPO" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET" \
              --repo "$REPO" \
              --title "Network Panel X $VERSION_NAME" \
              --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,assets,url

      - name: Remove signing material
        if: always()
        run: rm -f local.properties app/signing/networkpanelx-release.jks release-notes.md
